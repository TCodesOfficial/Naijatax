name: CI

on:
  push:
    branches: [master,main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # The generated Prisma client must exist before tsc: without it
      # @prisma/client is a stub and every import/type inference fails
      # (TS2305 + cascading implicit-any errors). Dummy URLs are fine —
      # generate never connects to the database.
      - run: npx prisma generate
        env:
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      - run: npx tsc --noEmit
      # vitest.config.ts supplies dummy env vars, so no secrets are needed.
      - run: npm test

  client:
    name: Client — flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
