org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Flutter's Gradle plugin force-enables resource shrinking in release builds.
# Our test builds run with isMinifyEnabled=false (R8 needs more RAM than this
# machine has), and resource shrinking requires code shrinking — so disable it
# here. For production minified builds: delete this line AND set
# isMinifyEnabled=true in app/build.gradle.kts.
shrink=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Low-memory build settings (8 GB machine): no separate Kotlin daemon,
# fewer parallel workers, so the build doesn't run out of RAM and stall.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=false
